<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Baiak Idle - XP/h Real</title>
  <style>
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #16161a;
      color: #f0f0f0;
      margin: 0;
      padding: 14px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #ffd76a;
    }
    p {
      font-size: 12px;
      color: #b8b8b8;
      line-height: 1.4;
      margin: 0 0 12px;
    }
    button {
      width: 100%;
      background: #ffd76a;
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover {
      background: #ffe08a;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
      color: #6bffb0;
      text-align: center;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h1>Baiak Idle · XP/h Real</h1>
  <p>
    O painel flutuante aparece na página do jogo. Arraste-o pelo topo e escolha
    a janela de tempo (1min / 5min / 15min / Sessão) para ver um XP/h mais
    preciso, calculado com base no XP Gain real.
  </p>
  <button id="reset-btn">Resetar dados coletados</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
